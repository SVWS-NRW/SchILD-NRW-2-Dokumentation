name: Bedienung prüfen
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, master]
permissions:
  contents: read
env:
  # Mehr Node-Speicher.
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  browser-check:
    runs-on: ubuntu-24.04
    # Das Zeitlimit umfasst auch Build und Browserinstallation.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Chromium für den Browsercheck bereitstellen
        run: |
          npx playwright install chromium --only-shell
          if ! node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch(); await browser.close()"; then
            npx playwright install-deps chromium
          fi
      - run: npm run docs:check-browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-fehler
          path: test-results
