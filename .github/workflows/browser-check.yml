name: Bedienung prüfen
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:check-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-pruefung
          path: |
            test-results
            migration/browser-check.json
