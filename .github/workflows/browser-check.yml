name: Bedienung prüfen
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
env:
  NODE_OPTIONS: --max-old-space-size=6144
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      # Chrome is included in the pinned GitHub runner image:
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
      - run: QA_BROWSER="$(command -v google-chrome)" npm run docs:check-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-pruefung
          path: |
            test-results
            migration/browser-check.json
