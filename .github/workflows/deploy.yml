name: Dokumentation auf GitHub Pages veröffentlichen
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCS_BASE: /
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1
      - name: Node.js einrichten
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: GitHub Pages konfigurieren
        if: github.ref == 'refs/heads/master'
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Tests ausführen
        run: npm test
      - name: Website für die Domainwurzel erstellen
        run: npm run docs:build
      - name: Interne Links und Bilder prüfen
        run: npm run docs:check
      - name: Build für den eigenen Webserver bereitstellen
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: schild2-domain
          path: .vitepress/dist
      - name: GitHub-Pages-Pfad berücksichtigen
        if: steps.pages.outputs.base_path != ''
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run docs:build
      - name: GitHub-Pages-Links und Bilder prüfen
        if: steps.pages.outputs.base_path != ''
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run docs:check
      - name: Website für die Veröffentlichung hochladen
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .vitepress/dist
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5.0.1
