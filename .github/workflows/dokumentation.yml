name: Dokumentation prüfen
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:build
      - run: npm run docs:check
